name: PR-pipeline_pypto

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
      types: [ created ]
      keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  obs_smoke_path: "${{ env.obs_path }}/presmoke/3"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_ARM }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: compile
    jobs:
      JOB_codecheck_action:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_x86_compile:
        name: Compile_x86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
          arch: 'x64'
          package_name: 'cann-pypto_linux-x86_64'
      JOB_x86_compile_ubuntu24:
        name: Compile_x86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24 }}
          arch: 'x64'
          package_name: 'cann-pypto_linux-x86_64_ubuntu24'
      JOB_arm_compile:
        name: Compile_arm
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
          arch: 'arm64'
          package_name: 'cann-pypto_linux-aarch64'
      JOB_arm_compile_ubuntu24:
        name: Compile_arm_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_ubuntu24'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}
          arch: 'arm64'
          package_name: 'cann-pypto_linux-aarch64_ubuntu24'
      JOB_staticcheck_md_check:
        name: CodeCheck_staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: UT
    jobs:
      JOB_UT_Test_Cpp_make_gnu_part_1:
        name: UT_Test_Cpp_make_gnu_part_1
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'make_gnu_1'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_gnu_part_1 }}
          runner_spec: 'xlarge'
      JOB_UT_Test_Cpp_make_gnu_part_2:
        name: UT_Test_Cpp_make_gnu_part_2
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'make_gnu_2'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_gnu_part_2 }}
          runner_spec: 'xlarge'
      JOB_UT_Test_Cpp_make_gnu_part_3:
        name: UT_Test_Cpp_make_gnu_part_3
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'make_gnu_3'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_gnu_part_3 }}
          runner_spec: 'xlarge'
      JOB_UT_Test_Py3_ninja:
        name: UT_Test_Py3_ninja
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'Py3_ninja'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Py3_ninja }}
          runner_spec: 'xlarge'
      JOB_UT_Test_Py3_ninja_interpreter:
        name: UT_Test_Py3_ninja_interpreter
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'ninja_interpreter'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Py3_ninja }}
          runner_spec: 'xlarge'
      JOB_UT_Test_Py3_ninja_simulation:
        name: UT_Test_Py3_ninja_simulation
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'Py3_ninja_simulation'
          ut_package: 'ut_cov*.tar.gz'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Py3_ninja_simulation }}
          runner_spec: 'xlarge'
      JOB_UT_Test_Cpp_make_clang_part_1:
        name: UT_Test_Cpp_make_clang_part_1
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'make_clang1'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_clang }}
          runner_spec: '2xlarge'
      JOB_UT_Test_Cpp_make_clang_part_2:
        name: UT_Test_Cpp_make_clang_part_2
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'make_clang2'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_clang }}
          runner_spec: '2xlarge'
      JOB_UT_Test_Cpp_make_clang_part_3:
        name: UT_Test_Cpp_make_clang_part_3
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'make_clang3'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_clang }}
          runner_spec: '2xlarge'
      JOB_UT_Test_kirinx90:
        name: UT_Test_kirinx90
        uses: .gitcode/workflows/llt_action.yml
        if: ${{ env.TARGET_BRANCH == 'master' }}
        with:
          ut_type: 'kirinx90'
          ut_package: 'ut_cov_*.tar.gz'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_gnu_part_3 }}
          runner_spec: 'xlarge'
      JOB_UT_Test_kirin9030:
        name: UT_Test_kirin9030
        uses: .gitcode/workflows/llt_action.yml
        if: ${{ env.TARGET_BRANCH == 'master' }}
        with:
          ut_type: 'kirin9030'
          ut_package: 'ut_cov_*.tar.gz'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_Cpp_make_gnu_part_3 }}
          runner_spec: 'xlarge'
    pre:
    - type: auto
    fail-fast: false
  stage4:
    name: UT_report
    jobs:
      JOB_ut_report:
        name: UT_report
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: ut_report
            identifier: ut-report
            uses: cann/.gitcode/actions/ut-cov-report@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              cov_mode: "report"
              ut_field: "pypto"
              modules: "make_gnu_1 make_gnu_2 make_gnu_3 Py3_ninja ninja_interpreter"
              source_branch: ${{ env.SOURCE_BRANCH }}
              target_branch: ${{ env.TARGET_BRANCH }}
              obs_path: ${{ env.obs_path }}
              git_token: ${{secrets.GIT_TOKEN}}
          -
            name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{secrets.AK}}
              secret-key: ${{secrets.SK}}
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/ut_cov_*.tar.gz
              object-prefix: ${{ env.obs_path }}/
        if: "${{ default() }}"
        runs-on: ["self-hosted", "arch=x64", "spec=large"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.UT_Test_report }}
    pre:
    - type: auto
    fail-fast: true
  stage5:
    name: PreSmoke
    jobs:
      A3_smoke:
        name: PreSmoke_A3
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
              export repo_name=${{env.repo_name}}
              export pr_id=${{ env.MERGE_ID }}
              export obs_smoke_path=${{ env.obs_smoke_path }}
              export obs_path=${{ env.obs_path }}
              export AK=${{secrets.AK}}
              export SK=${{secrets.SK}}
              export GIT_TARGET_BRANCH=${{ env.TARGET_BRANCH }}
              export WORKSPACE=${{ steps.process_checkout.outputs.path }}
              bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          - name: upload
            uses: obs-upload
            if: ${{ always() }}
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog*.tar.gz"
              object-prefix: ${{ env.obs_smoke_path }}/plog/
        if: env.TARGET_BRANCH == 'master'
        runs-on: ['self-hosted','npu=4','smoke=301']
        container:
          image: swr.cn-north-12.myhuaweicloud.com/pre_smoke/ubuntu24.04_arm:pre_mindspore_A3_conda_v1.1023
    pre:
    - type: auto
    fail-fast: true

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
